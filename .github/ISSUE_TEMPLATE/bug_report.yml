name: Bug report
description: Report a reproducible problem in Zharwing Memory.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Zharwing Memory. Do not include tokens,
        private memory content, credentials, or proprietary repository data.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Daemon
        - CLI
        - MCP server
        - Browser UI
        - Desktop UI
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide sanitized steps using disposable data where possible.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Node 24, pnpm 9, desktop or browser UI
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets and private project or memory content from this report.
          required: true

